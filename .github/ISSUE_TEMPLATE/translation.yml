name: Translation fix
description: A wrong, unnatural or missing text in one language
labels: [i18n]
body:
  - type: input
    id: lang
    attributes:
      label: Language code (en, ms, tr, fr, es, de, ru, bn, hi, ar, ur)
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key or page where you saw it (for example quiz.leave.title)
  - type: textarea
    id: fix
    attributes:
      label: Current text and your proposed text
    validations:
      required: true
